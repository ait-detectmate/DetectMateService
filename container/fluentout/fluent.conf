


<source>
  @type nng_in
  @id input_nng
  <parse>
#     @type none
#    @type detectmate
    @type protobuf
    class_file /fluentd/etc/schemas_pb.rb
    class_name DetectorSchema
    protobuf_version protobuf3
  </parse>
  uri ipc:///run/output.ipc
  tag nng.*
</source>

<match nng.**>
  @type file
  path /fluentd/log/output.%Y%m%d
  compress text
  append true
  <buffer>
    flush_mode immediate
  </buffer>
</match>

# Second source: the rule-based detector (detector-rule) dials its own
# ipc socket, since each is a 1:1 pynng.Pair0 connection and can't share
# the socket above with the NewValueDetector.
<source>
  @type nng_in
  @id input_nng_rule
  <parse>
    @type protobuf
    class_file /fluentd/etc/schemas_pb.rb
    class_name DetectorSchema
    protobuf_version protobuf3
  </parse>
  uri ipc:///run/output-rule.ipc
  tag nngrule.*
</source>

<match nngrule.**>
  @type file
  path /fluentd/log/output-rule.%Y%m%d
  compress text
  append true
  <buffer>
    flush_mode immediate
  </buffer>
</match>

