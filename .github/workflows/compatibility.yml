name: Python compatibility

on:
  push:
    branches: [ "main", "development" ]
  pull_request:
    branches: [ "main", "development" ]


jobs:
  compatibility:
    name: Compatibility Python ${{ matrix.python-version }} / ${{ matrix.os }}

    runs-on: ${{ matrix.os }}

    continue-on-error: ${{ matrix.experimental }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - python-version: "3.12"
            os: blacksmith-2vcpu-ubuntu-2404
            experimental: false
          - python-version: "3.13"
            os: blacksmith-2vcpu-ubuntu-2404
            experimental: false
          - python-version: "3.14"
            os: blacksmith-2vcpu-ubuntu-2404
            experimental: false
          - python-version: "3.14"
            os: blacksmith-2vcpu-ubuntu-2404-arm
            experimental: false
          - python-version: "3.14"
            os: blacksmith-6vcpu-macos-latest
            experimental: false
          - python-version: "3.15"
            os: blacksmith-2vcpu-ubuntu-2404
            experimental: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true

      - name: Install dependencies
        run: uv sync --python ${{ matrix.python-version }} --extra full --dev

      - name: Run tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/test_compatibility.py
