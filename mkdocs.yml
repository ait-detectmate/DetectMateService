site_name: DetectMate Service
site_url: https://ait-detectmate.github.io/DetectMateService/

theme:
  name: material
  logo: img/logo_service.png
  favicon: img/logo.svg
  features:
    - navigation.footer   # previous / next page links at the bottom of every page
    - content.code.copy
  palette:
    # Light mode configuration
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

    # Dark mode configuration
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Tutorial: tutorial.md
  - User Guide:
    - Installation: installation.md
    - Configuration: configuration.md
    - Usage:
      - Running the Service: usage.md
      - Using a Library Component: library.md
      - Monitoring with Prometheus: prometheus.md
    - Docker Compose Reference: docker-compose.md
  - Contributing:
    - Git Workflow: contribution.md
    - Development:
      - Overview: development.md
      - Library Imports: library-imports.md
      - Interfaces: interfaces.md
  - Maintainers:
    - Release Process: release.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.arithmatex:
      generic: true
  - attr_list
  - pymdownx.highlight:
      pygments_lang_class: true

extra_css:
  - stylesheets/extra.css

extra:
  version:
    provider: mike
