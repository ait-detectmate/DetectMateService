[project]
name = "DetectMateService"
description = "A modular framework for building log processing and anomaly detection services."
readme = "README.md"
requires-python = ">=3.12"

dynamic = ["version"]

dependencies = [
    "detectmatelibrary==0.4.0",
    "pathlib>=1.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pynng>=0.8.1",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12.20260518",
    "requests>=2.34.2",
    "prometheus-client>=0.25.0",
    "uvicorn[standard]>=0.49.0",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# pass-through extras for optional detectmatelibrary components, e.g. uv sync --extra llm
llm = ["detectmatelibrary[llm]==0.4.0"]
dataframes = ["detectmatelibrary[dataframes]==0.4.0"]
polars-rtcompat = ["detectmatelibrary[polars-rtcompat]==0.4.0"]
# install all optional extras at once: uv sync --extra full
full = [
    "DetectMateService[llm]",
    "DetectMateService[dataframes]",
    "DetectMateService[polars-rtcompat]",
]

[dependency-groups]
dev = [
    "mike>=2.2.0",
    "pytest>=9.1.0",
    "prek>=0.4.5",
    "pytest-cov>=6.2.1",
    "types-requests",
    "DetectMateService[full]",
]

[project.scripts]
detectmate = "service.cli:main"
detectmate-client = "service.client:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "service.metadata.__version__"}
