[project]
name = "DetectMateService"
description = "A modular framework for building log processing and anomaly detection services."
readme = "README.md"
requires-python = ">=3.12"

dynamic = ["version"]

# NOTE: this is the only place detectmatelibrary's version is pinned. The
# llm/dataframes/polars-rtcompat extras below deliberately reference
# detectmatelibrary[extra] with no version — since it's the same package name,
# uv/pip unify it to this pin. Bump here, then run `uv lock`.
dependencies = [
    "detectmatelibrary==0.4.0",
    "pathlib>=1.0.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.14.1",
    "pynng>=0.8.1",
    "pyyaml>=6.0.2",
    "types-pyyaml>=6.0.12.20260518",
    "requests>=2.34.2",
    "prometheus-client>=0.25.0",
    "uvicorn[standard]>=0.51.0",
    "fastapi>=0.139.0",
    "httpx>=0.28.1",
    "python-multipart>=0.0.20",
]

[project.optional-dependencies]
# pass-through extras for optional detectmatelibrary components, e.g. uv sync --extra llm
llm = ["detectmatelibrary[llm]"]
dataframes = ["detectmatelibrary[dataframes]"]
polars-rtcompat = ["detectmatelibrary[polars-rtcompat]"]
# install all optional extras at once: uv sync --extra full
full = [
    "DetectMateService[llm]",
    "DetectMateService[dataframes]",
    "DetectMateService[polars-rtcompat]",
]

[dependency-groups]
dev = [
    "mike>=2.2.0",
    "pytest>=9.1.0",
    "prek>=0.4.8",
    "pytest-cov>=6.2.1",
    "pytest-xdist>=3.8.0",
    "types-requests",
    "httpx2>=2.7.0",
    "DetectMateService[full]",
]

[project.scripts]
detectmate = "service.cli:main"
detectmate-client = "service.client:main"

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
namespaces = true
where = ["src"]

[tool.setuptools.dynamic]
version = {attr = "service.metadata.__version__"}
